[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlm-mcp"
version = "0.1.0"
description = "Harness-agnostic MCP server bringing the Recursive Language Model paradigm to any agent, using the harness's own model"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "ProCleiton" }]
keywords = ["mcp", "rlm", "recursive-language-model", "agents", "llm", "repl", "long-context"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
rlm-mcp = "rlm_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ProCleiton/rlm-mcp"
Issues = "https://github.com/ProCleiton/rlm-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/rlm_mcp"]

[dependency-groups]
dev = [
    "tiktoken>=0.14.0",
]
